site_name: GRmap
site_description: Nextflow DSL2 workflow for read matching and genomic annotation
site_author: Abhinav Mishra and contributors
site_url: https://bibymaths.github.io/grmap
repo_url: https://github.com/bibymaths/grmap
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: indigo

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - def_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Implementation audit: audit.md
  - Architecture: architecture.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Parameters: parameters.md
  - Inputs and outputs: io.md
  - Running locally and on HPC: execution.md
  - Multi-chromosome extension guide: multi_chromosome.md
  - Testing: testing.md
  - Developer guide: developer.md
  - Contributing: contributing.md
  - Changelog and releases: changelog.md
  - Citation: citation.md
